<!DOCTYPE html>                                                                                                                                 
  <html>                                                                                                                                          
  <head>                                                                                                                                          
    <meta charset="utf-8">                                                                                                                        
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blockrain</title>                                                                                                                      
    <link rel="stylesheet" href="dist/blockrain.css">
    <style>                                                                                                                                       
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; background: #1a1a2e; display: flex; align-items: center; justify-content: center; }                 
      #game { width: 360px; height: 600px; }
    </style>                                                                                                                                      
  </head>  
  <body>                                                                                                                                          
    <div id="game"></div>
    <script src="assets/js/jquery-1.11.1.min.js"></script>
    <script src="dist/blockrain.jquery.js"></script>
    <script>                                                                                                                                      
      $('#game').blockrain({ theme: 'candy', showFieldOnGameover: true });
    </script>                                                                                                                                     
  </body>  
  </html>
