<!DOCTYPE html>                                                                                                                                 
  <html>                                                                                                                                          
  <head>                                                                                                                                          
    <meta charset="utf-8">                                                                                                                        
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blockrain</title>                                                                                                                      
    <link rel="stylesheet" href="dist/blockrain.css">
    <style>                                                                                                                                       
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content:   
  center; gap: 12px; font-family: sans-serif; }                                                                                                   
      #game { width: 360px; height: 600px; }                                                                                                      
      .theme-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }                                                           
      .theme-bar button {                                                                                                                         
        padding: 4px 12px; border: none; border-radius: 20px;
        background: #333; color: #fff; font-size: 12px; cursor: pointer;                                                                          
      }                                                                                                                                           
      .theme-bar button:hover { background: #555; }                                                                                               
      .theme-bar button.active { background: #6366f1; }                                                                                           
    </style>
  </head>                                                                                                                                         
  <body>
    <div class="theme-bar">                                                                                                                       
      <button onclick="setTheme('modern')" class="active">Modern</button>
      <button onclick="setTheme('candy')">Candy</button>                                                                                          
      <button onclick="setTheme('retro')">Retro</button>
      <button onclick="setTheme('vim')">Vim</button>                                                                                              
      <button onclick="setTheme('monochrome')">Monochrome</button>
      <button onclick="setTheme('gameboy')">Gameboy</button>                                                                                      
      <button onclick="setTheme('aerolab')">Aerolab</button>
    </div>                                                                                                                                        
    <div id="game"></div>
    <script src="assets/js/jquery-1.11.1.min.js"></script>                                                                                        
    <script src="dist/blockrain.jquery.js"></script>
    <script>
      var currentTheme = 'modern';                                                                                                                
      function setTheme(theme) {
        currentTheme = theme;                                                                                                                     
        document.querySelectorAll('.theme-bar button').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');                                                                                                     
        $('#game').blockrain({ theme: theme, showFieldOnGameover: true });
      }                                                                                                                                           
      $('#game').blockrain({ theme: 'modern', showFieldOnGameover: true });
    </script>                                                                                                                                     
  </body>
  </html>
